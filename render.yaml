services:
  - type: web
    name: health-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: Health Platform <security@health-platform.org>
    healthCheckPath: /api/v1/health
    autoDeploy: true
